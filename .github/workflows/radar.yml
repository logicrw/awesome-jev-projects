name: Ecosystem radar
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Full discovery or metadata refresh
        type: choice
        options: [full, metadata-only]
        default: full
permissions: {}
concurrency:
  group: ecosystem-radar
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'logicrw/awesome-jev-projects' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Discover projects and refresh metadata
        run: |
          if [ "$RADAR_MODE" = "metadata-only" ]; then
            node scripts/radar-sync.mjs --metadata-only
          else
            node scripts/radar-sync.mjs
          fi
        env:
          RADAR_MODE: ${{ inputs.mode || 'full' }}
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.MUSE_API_KEY }}
          DEEPSEEK_ENDPOINT: ${{ secrets.DEEPSEEK_ENDPOINT || vars.DEEPSEEK_ENDPOINT || secrets.MUSE_ENDPOINT || vars.MUSE_ENDPOINT || '' }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || vars.DEEPSEEK_MODEL || secrets.MUSE_MODEL || vars.MUSE_MODEL || '' }}
          MUSE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.MUSE_API_KEY }}
          MUSE_ENDPOINT: ${{ secrets.DEEPSEEK_ENDPOINT || vars.DEEPSEEK_ENDPOINT || secrets.MUSE_ENDPOINT || vars.MUSE_ENDPOINT || '' }}
          MUSE_MODEL: ${{ secrets.DEEPSEEK_MODEL || vars.DEEPSEEK_MODEL || secrets.MUSE_MODEL || vars.MUSE_MODEL || '' }}
          RADAR_MAX_PAGES: "2"
          RADAR_MAX_CANDIDATES: "60"
      - name: Retain data snapshot before any dependencies run
        id: snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/data/projects.json
            src/data/radar.json
            radar/receipts
            radar/state.json
          retention-days: 14
          if-no-files-found: error
  validate:
    needs: scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - run: node scripts/workflow-data.mjs radar "$RUNNER_TEMP/candidate"
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Validate data and frontend
        run: npm test && npm run build
  publish:
    needs: [scan, validate]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - run: node scripts/workflow-data.mjs radar "$RUNNER_TEMP/candidate"
      - name: Publish data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/projects.json src/data/radar.json radar/receipts radar/state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Jev ecosystem radar"
            # A concurrent main change causes a safe rejection; never force or overwrite it.
            git -c credential.helper='!gh auth git-credential' push origin HEAD:main
          fi
