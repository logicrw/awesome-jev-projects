name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Ecosystem radar]
    branches: [main]
    types: [completed]
permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publication-gate:
    if: >-
      github.repository == 'logicrw/awesome-jev-projects' &&
      ((github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name == 'Ecosystem radar' &&
        github.event.workflow_run.path == '.github/workflows/radar.yml' &&
        contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          allowed=true
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            step='Publish data snapshot'
            allowed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/jobs?per_page=100" --jq "any(.jobs[].steps[]; .name == \"$step\" and .conclusion == \"success\")")
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
  build:
    needs: publication-gate
    if: needs.publication-gate.outputs.allowed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: npm run build
      # upload-pages-artifact excludes every hidden path, including .well-known.
      # Archive only the audited dist, then verify every file survives packaging.
      - name: Package complete Pages site
        run: |
          tar -C dist -cf "$RUNNER_TEMP/artifact.tar" .
          node scripts/audit-pages-archive.mjs "$RUNNER_TEMP/artifact.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  acknowledge-submissions:
    needs: [build, deploy]
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Confirm live inclusion, then thank and close
        run: node scripts/issue-ingestion.mjs acknowledge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INGEST_TRUSTED_WRITER: ${{ vars.INGEST_TRUSTED_WRITER || '' }}
          DEPLOYED_SHA: ${{ needs.build.outputs.source_sha }}
