name: Issue ingestion
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to retry
        type: number
        default: 0
      dry_run:
        description: Prepare locally without model calls or writes; remote_probe explicitly runs a live diagnostic
        type: boolean
        default: true
      body_sha:
        description: Exact Issue body revision for a scheduled retry
        type: string
        default: ''
      title_sha:
        description: Exact Issue title revision for a scheduled retry
        type: string
        default: ''
      review_revision:
        description: Exact trusted review policy expected by a scheduled retry
        type: string
        default: ''
      retry_claim_id:
        description: Persisted retry claim identity
        type: string
        default: ''
      retry_attempt:
        description: Persisted retry attempt
        type: number
        default: 0
      models_probe:
        description: Check local fallback (remote credentials intentionally disabled)
        type: boolean
        default: false
      remote_probe:
        description: Probe remote model endpoint with live secrets
        type: boolean
        default: false
permissions: {}
env:
  REVIEW_PROVIDER_CONFIGURED: ${{ secrets.DEEPSEEK_API_KEY != '' }}
  DEEPSEEK_ENDPOINT: ${{ secrets.DEEPSEEK_ENDPOINT || vars.DEEPSEEK_ENDPOINT || '' }}
  DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || vars.DEEPSEEK_MODEL || '' }}
  TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || '' }}
  REVIEW_CONFIG_REVISION: ${{ vars.REVIEW_CONFIG_REVISION || vars.RADAR_REVIEW_REVISION || '' }}
concurrency:
  group: ingest-issue-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false
jobs:
  reserve-budget:
    if: >-
      github.repository == 'logicrw/awesome-jev-projects' &&
      github.ref == 'refs/heads/main' &&
      (!github.event.issue.pull_request) &&
      (github.event_name != 'issue_comment' || (
        !endsWith(github.event.comment.user.login, '[bot]') &&
        github.event.comment.user.login != 'github-actions' &&
        github.event.comment.user.login != github.repository_owner &&
        github.event.issue.state == 'open'
      ))
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.reserve.outputs.allowed }}
      local_only: ${{ steps.reserve.outputs.local_only }}
      issue_number: ${{ steps.reserve.outputs.issue_number }}
      body_sha: ${{ steps.reserve.outputs.body_sha }}
      title_sha: ${{ steps.reserve.outputs.title_sha }}
      review_revision: ${{ steps.reserve.outputs.review_revision }}
      reservation_id: ${{ steps.reserve.outputs.reservation_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - id: reserve
        if: '!inputs.models_probe && !inputs.remote_probe'
        run: node scripts/ingestion-retry.mjs budget-reserve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INGEST_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || 0 }}
          INGEST_ISSUE_BODY_SHA: ${{ inputs.body_sha || '' }}
          INGEST_ISSUE_TITLE_SHA: ${{ inputs.title_sha || '' }}
          INGEST_REVIEW_REVISION: ${{ inputs.review_revision || '' }}
          INGEST_TRUSTED_WRITER: ${{ vars.INGEST_TRUSTED_WRITER || '' }}
          INGEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
  review:
    needs: reserve-budget
    if: always() && needs.reserve-budget.result == 'success' && (needs.reserve-budget.outputs.allowed == 'true' || needs.reserve-budget.outputs.local_only == 'true' || inputs.dry_run || inputs.models_probe || inputs.remote_probe)
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.review.outputs.ready }}
      status: ${{ steps.review.outputs.status }}
      needs_evidence: ${{ steps.review.outputs.needs_evidence }}
      retry: ${{ steps.review.outputs.retry }}
      retry_not_before: ${{ steps.review.outputs.retry_not_before }}
      issue_number: ${{ steps.review.outputs.issue_number }}
      issue_body_sha: ${{ steps.review.outputs.issue_body_sha }}
      issue_title_sha: ${{ steps.review.outputs.issue_title_sha }}
      review_revision: ${{ steps.review.outputs.review_revision }}
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # Node built-ins only: no package installation, submitted code or account PAT.
      - name: Review bounded material and reuse checked summaries
        id: review
        run: node scripts/issue-ingestion.mjs prepare
        env:
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_ENDPOINT: ${{ secrets.DEEPSEEK_ENDPOINT || vars.DEEPSEEK_ENDPOINT || '' }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || vars.DEEPSEEK_MODEL || '' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || '' }}
          INGEST_ISSUE_NUMBER: ${{ inputs.issue_number || 0 }}
          INGEST_MODELS_PROBE: ${{ inputs.models_probe || false }}
          INGEST_REMOTE_PROBE: ${{ inputs.remote_probe || false }}
          INGEST_REVIEWED_SHA: ${{ steps.source.outputs.sha }}
          INGEST_EXPECTED_BODY_SHA: ${{ needs.reserve-budget.outputs.body_sha || inputs.body_sha || '' }}
          INGEST_EXPECTED_TITLE_SHA: ${{ needs.reserve-budget.outputs.title_sha || inputs.title_sha || '' }}
          INGEST_EXPECTED_REVIEW_REVISION: ${{ needs.reserve-budget.outputs.review_revision || inputs.review_revision || '' }}
          INGEST_BUDGET_RESERVATION_ID: ${{ needs.reserve-budget.outputs.reservation_id || '' }}
          INGEST_RETRY_CLAIM_ID: ${{ inputs.retry_claim_id || '' }}
          INGEST_RETRY_ATTEMPT: ${{ inputs.retry_attempt || 0 }}
          INGEST_TRUSTED_WRITER: ${{ vars.INGEST_TRUSTED_WRITER || '' }}
          INGEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      - name: Prepare immutable data-only receipt
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ingestion-candidate"
          if [ -f "$RUNNER_TEMP/ingestion-result.json" ]; then
            cp "$RUNNER_TEMP/ingestion-result.json" "$RUNNER_TEMP/ingestion-candidate/ingestion-result.json"
          fi
          if [ "$READY" = 'true' ]; then
            cp src/data/projects.json "$RUNNER_TEMP/ingestion-candidate/candidate-projects.json"
          fi
        env:
          READY: ${{ steps.review.outputs.ready }}
      - name: Retain ingestion receipt
        id: receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-ingestion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ingestion-candidate/
          retention-days: 14
  settle-budget:
    needs: [reserve-budget, review]
    if: always() && needs.reserve-budget.outputs.allowed == 'true' && needs.review.outputs.artifact_id != ''
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.review.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.review.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Settle locally generated model budget receipt
        run: node scripts/ingestion-retry.mjs budget-settle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INGEST_RESULT_FILE: ${{ runner.temp }}/candidate/ingestion-result.json
          INGEST_ISSUE_NUMBER: ${{ needs.reserve-budget.outputs.issue_number }}
          INGEST_ISSUE_BODY_SHA: ${{ needs.reserve-budget.outputs.body_sha }}
          INGEST_ISSUE_TITLE_SHA: ${{ needs.reserve-budget.outputs.title_sha }}
          INGEST_REVIEW_REVISION: ${{ needs.reserve-budget.outputs.review_revision }}
          INGEST_BUDGET_RESERVATION_ID: ${{ needs.reserve-budget.outputs.reservation_id }}
          INGEST_TRUSTED_WRITER: ${{ vars.INGEST_TRUSTED_WRITER || '' }}
  validate:
    needs: review
    if: needs.review.outputs.ready == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.review.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.review.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - run: node scripts/workflow-data.mjs ingestion "$RUNNER_TEMP/candidate"
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Validate candidate data and website with bounded local self-healing
        # The build repair's local fallback remains active; paid review calls
        # must stay inside the durable per-case reservation above.
        run: node scripts/mos-self-heal.mjs validate
      - name: Bind validated derived assets to the immutable candidate
        run: node scripts/ingestion-assets.mjs "$RUNNER_TEMP/candidate/candidate-projects.json" "$RUNNER_TEMP/validated-assets/ingestion-assets.json"
        env:
          INGEST_REVIEWED_SHA: ${{ needs.review.outputs.source_sha }}
      - name: Retain validated data-only assets
        id: assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-ingestion-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-assets/ingestion-assets.json
          if-no-files-found: error
          retention-days: 14
  publish:
    outputs:
      retry: ${{ steps.publish.outputs.retry }}
      issue_number: ${{ steps.publish.outputs.issue_number }}
      issue_body_sha: ${{ steps.publish.outputs.issue_body_sha }}
      issue_title_sha: ${{ steps.publish.outputs.issue_title_sha }}
      review_revision: ${{ steps.publish.outputs.review_revision }}
    needs: [review, validate]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    permissions:
      contents: write
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.review.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # The original review remains canonical authority; validation supplies only bounded assets.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.review.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/validated-assets
          merge-multiple: true
      # Node built-ins only. No dependency execution or regeneration in this write-enabled job.
      - name: Append through an atomic main-branch commit
        id: publish
        run: node scripts/issue-ingestion.mjs publish
        env:
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN || github.token }}
          INGEST_RESULT_FILE: ${{ runner.temp }}/candidate/ingestion-result.json
          INGEST_ASSET_FILE: ${{ runner.temp }}/validated-assets/ingestion-assets.json
          INGEST_REVIEWED_SHA: ${{ needs.review.outputs.source_sha }}
          INGEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          INGEST_EXPECTED_BODY_SHA: ${{ inputs.body_sha || '' }}
          INGEST_EXPECTED_TITLE_SHA: ${{ inputs.title_sha || '' }}
          INGEST_EXPECTED_REVIEW_REVISION: ${{ inputs.review_revision || '' }}
          INGEST_RETRY_CLAIM_ID: ${{ inputs.retry_claim_id || '' }}
          INGEST_RETRY_ATTEMPT: ${{ inputs.retry_attempt || 0 }}
          INGEST_TRUSTED_WRITER: ${{ vars.INGEST_TRUSTED_WRITER || '' }}
  record-retry:
    needs: [reserve-budget, review, settle-budget, validate, publish]
    if: always() && github.repository == 'logicrw/awesome-jev-projects' && !inputs.remote_probe && !inputs.models_probe && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && (needs.publish.outputs.retry == 'true' || needs.review.outputs.status == 'transient-retry' || needs.reserve-budget.result == 'failure' || needs.review.result == 'failure' || needs.validate.result == 'failure' || needs.publish.result == 'failure')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.review.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # No dependency installation; only records a bounded, body-bound retry.
      - run: node scripts/ingestion-retry.mjs recover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INGEST_ISSUE_NUMBER: ${{ needs.publish.outputs.issue_number || needs.review.outputs.issue_number || github.event.issue.number || inputs.issue_number || 0 }}
          INGEST_ISSUE_BODY_SHA: ${{ needs.publish.outputs.issue_body_sha || needs.review.outputs.issue_body_sha || inputs.body_sha || '' }}
          INGEST_ISSUE_TITLE_SHA: ${{ needs.publish.outputs.issue_title_sha || needs.review.outputs.issue_title_sha || inputs.title_sha || '' }}
          INGEST_REVIEW_REVISION: ${{ needs.publish.outputs.review_revision || needs.review.outputs.review_revision || inputs.review_revision || '' }}
          INGEST_RETRY_NOT_BEFORE: ${{ needs.review.outputs.retry_not_before || '' }}
          INGEST_TRUSTED_WRITER: ${{ vars.INGEST_TRUSTED_WRITER || '' }}
          INGEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
  respond-feedback:
    needs: review
    if: github.repository == 'logicrw/awesome-jev-projects' && contains(fromJSON('["rejected","duplicate","insufficient-evidence","invalid-output","provider-unavailable","budget-exhausted"]'), needs.review.outputs.status) && needs.review.outputs.issue_number != '0' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.review.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.review.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Post feedback comment and label issue
        run: node scripts/issue-ingestion.mjs feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INGEST_RESULT_FILE: ${{ runner.temp }}/candidate/ingestion-result.json
          INGEST_EXPECTED_BODY_SHA: ${{ inputs.body_sha || '' }}
          INGEST_EXPECTED_TITLE_SHA: ${{ inputs.title_sha || '' }}
          INGEST_EXPECTED_REVIEW_REVISION: ${{ inputs.review_revision || '' }}
          INGEST_RETRY_CLAIM_ID: ${{ inputs.retry_claim_id || '' }}
          INGEST_RETRY_ATTEMPT: ${{ inputs.retry_attempt || 0 }}
          INGEST_TRUSTED_WRITER: ${{ vars.INGEST_TRUSTED_WRITER || '' }}
          INGEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
# The Pages workflow reconciles accepted Issues only after live deployment.
