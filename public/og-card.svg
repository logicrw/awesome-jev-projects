<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Awesome Jev — System-1 Agent Architecture Radar">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f09"/>
      <stop offset="45%" stop-color="#10170f"/>
      <stop offset="100%" stop-color="#162115"/>
    </linearGradient>

    <!-- Radar Ambient Glow -->
    <radialGradient id="radarGlow" cx="950" cy="270" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d7fa91" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#d7fa91" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d7fa91" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Left Warm Brass Glow -->
    <radialGradient id="brassGlow" cx="180" cy="90" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7b5b28" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#7b5b28" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7b5b28" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#253521" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#445c3a" fill-opacity="0.45"/>
    </pattern>

    <!-- Brass Gradient -->
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcedc7"/>
      <stop offset="50%" stop-color="#d9bc82"/>
      <stop offset="100%" stop-color="#997b42"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#brassGlow)"/>
  <rect width="1200" height="630" fill="url(#radarGlow)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#2e3e29" stroke-width="1.5"/>

  <!-- ================= LEFT COLUMN: HERO INFORMATION ================= -->
  <!-- Status Badge -->
  <g transform="translate(68, 62)">
    <rect width="360" height="30" rx="15" fill="#182317" stroke="#384c33" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#d7fa91"/>
    <circle cx="16" cy="15" r="8" fill="none" stroke="#d7fa91" stroke-width="1" stroke-opacity="0.4"/>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, Monaco, monospace" font-size="11.5" font-weight="700" fill="#d7fa91" letter-spacing="0.6">SYSTEM-1 AGENT RADAR · 50–100ms FAST PATH</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(68, 122)">
    <!-- Lightning Icon Badge -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#1e2c1c" stroke="#48603e" stroke-width="1.2"/>
    <path d="M26 10 L14 26 L23 26 L20 38 L32 22 L23 22 Z" fill="#d7fa91"/>

    <!-- Brand Name -->
    <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2" fill="#f4f7f0">Awesome Jev</text>
    
    <!-- Version Chip -->
    <rect x="315" y="10" width="62" height="24" rx="6" fill="#243322" stroke="#455e3c" stroke-width="0.8"/>
    <text x="325" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#a4bd9a">v2.0</text>
  </g>

  <!-- Core Slogans -->
  <g transform="translate(68, 206)">
    <!-- Primary Chinese Slogan -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">把思考留给大模型，把选择题交给 Jev。</text>

    <!-- Secondary English Subtitle -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif" font-size="20" font-weight="400" fill="#9db394" letter-spacing="-0.2">System-1 Agent Architecture Radar · Deterministic reflex &amp; source evidence</text>
  </g>

  <!-- Architecture Primitives: Choice · Score · Noul -->
  <g transform="translate(68, 318)">
    <!-- Choice Chip -->
    <g transform="translate(0, 0)">
      <rect width="168" height="52" rx="10" fill="#162215" stroke="#364930" stroke-width="1"/>
      <text x="14" y="24" font-size="14">⚡</text>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#d7fa91">Choice</text>
      <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7a9072">N-Pick-1</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#9db394">离散动作多选一</text>
    </g>

    <!-- Score Chip -->
    <g transform="translate(182, 0)">
      <rect width="168" height="52" rx="10" fill="#162215" stroke="#364930" stroke-width="1"/>
      <text x="14" y="24" font-size="14">🎯</text>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#d7fa91">Score</text>
      <text x="86" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7a9072">Continuous</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#9db394">连续置信度打分</text>
    </g>

    <!-- Noul Chip -->
    <g transform="translate(364, 0)">
      <rect width="168" height="52" rx="10" fill="#162215" stroke="#364930" stroke-width="1"/>
      <text x="14" y="24" font-size="14">🛡️</text>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#d7fa91">Noul</text>
      <text x="78" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7a9072">True / False</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#9db394">二元门禁与拦截</text>
    </g>
  </g>

  <!-- Key Metrics Row -->
  <g transform="translate(68, 404)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="30" font-weight="800" fill="#f0ca7d">662+</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#889e81">开源生态项目收录</text>
    </g>

    <line x1="148" y1="8" x2="148" y2="56" stroke="#2a3a25" stroke-width="1"/>

    <!-- Metric 2 -->
    <g transform="translate(176, 0)">
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="30" font-weight="800" fill="#d7fa91">&lt; 100ms</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#889e81">确定性极速反射</text>
    </g>

    <line x1="324" y1="8" x2="324" y2="56" stroke="#2a3a25" stroke-width="1"/>

    <!-- Metric 3 -->
    <g transform="translate(352, 0)">
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="30" font-weight="800" fill="#f4f7f0">100%</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#889e81">严格绑定固定源码</text>
    </g>
  </g>

  <!-- Footer Divider Line -->
  <line x1="68" y1="520" x2="1132" y2="520" stroke="#263521" stroke-width="1"/>

  <!-- Footer Info Bar -->
  <g transform="translate(68, 560)">
    <!-- Site URL -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="15" font-weight="500" fill="#7d9376">logicrw.github.io/awesome-jev-projects</text>

    <!-- Tagline Badge -->
    <rect x="360" y="-17" width="180" height="24" rx="6" fill="#182317" stroke="#33462d" stroke-width="0.8"/>
    <text x="372" y="-1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#889e81">开源 · 纯静态 · 零商业跟踪</text>

    <!-- Curator Twitter Profile -->
    <g transform="translate(860, -18)">
      <rect width="204" height="28" rx="8" fill="#1b241a" stroke="#485c41" stroke-width="1"/>
      <!-- X / Twitter Icon -->
      <path d="M14 6 L20.5 15 L14 22 H15.8 L21.3 16.3 L25.5 22 H29.5 L22.8 12.5 L28.8 6 H27 L22 11.5 L18.2 6 Z" fill="#f0ca7d"/>
      <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#f0ca7d">Curated by @0xLogicrw</text>
    </g>
  </g>


  <!-- ================= RIGHT COLUMN: TACTILE RADAR DISPENSER ================= -->
  <!-- Concentric Radar Background Rings -->
  <g transform="translate(940, 270)">
    <!-- Concentric Circles -->
    <circle r="220" fill="none" stroke="#23301f" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="170" fill="none" stroke="#2b3b27" stroke-width="1"/>
    <circle r="120" fill="none" stroke="#354930" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#3f5639" stroke-width="1"/>
    
    <!-- Crosshair Lines -->
    <line x1="-230" y1="0" x2="230" y2="0" stroke="#23301f" stroke-width="1"/>
    <line x1="0" y1="-230" x2="0" y2="230" stroke="#23301f" stroke-width="1"/>
    
    <!-- Radar Sweep Wedge -->
    <path d="M 0 0 L 170 -140 A 220 220 0 0 1 218 -30 Z" fill="#d7fa91" fill-opacity="0.12"/>

    <!-- Target Blips -->
    <g transform="translate(95, -70)">
      <circle r="4.5" fill="#d7fa91"/>
      <circle r="10" fill="none" stroke="#d7fa91" stroke-width="1" stroke-opacity="0.6"/>
    </g>
    <g transform="translate(-120, 85)">
      <circle r="4" fill="#f0ca7d"/>
      <circle r="8" fill="none" stroke="#f0ca7d" stroke-width="0.8" stroke-opacity="0.5"/>
    </g>
    <g transform="translate(145, 110)">
      <circle r="3.5" fill="#d7fa91" fill-opacity="0.8"/>
    </g>
    <g transform="translate(-75, -135)">
      <circle r="3.5" fill="#d7fa91" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- Tactile Card Dispenser & Ejected Card Stack -->
  <g transform="translate(800, 105)">
    <!-- Dispenser Chassis Lip (Top mechanical feeder) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="34" rx="8" fill="#151e14" stroke="#364930" stroke-width="1.2"/>
      <!-- Metallic Screws -->
      <circle cx="10" cy="17" r="2.5" fill="url(#brassGrad)"/>
      <circle cx="270" cy="17" r="2.5" fill="url(#brassGrad)"/>
      <!-- Feed slot -->
      <rect x="22" y="8" width="236" height="12" rx="4" fill="#0d130c"/>
      <circle cx="246" cy="14" r="3" fill="#d7fa91"/>
      <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="9" font-weight="700" fill="#d9bc82" letter-spacing="1">JEV-01 // TACTILE DISPATCHER</text>
    </g>

    <!-- Stack Layer 1 (Underlying tilted back card) -->
    <rect x="-14" y="44" width="270" height="334" rx="14" fill="#162215" stroke="#3d5236" stroke-width="1" transform="rotate(-6 120 200)"/>

    <!-- Stack Layer 2 (Middle card with subtle highlight) -->
    <rect x="18" y="40" width="270" height="334" rx="14" fill="#1b2819" stroke="#486240" stroke-width="1" transform="rotate(4 150 200)"/>

    <!-- Active Ejected Tactile Card (Foreground High-Contrast Card) -->
    <g transform="translate(5, 46)" filter="url(#cardShadow)">
      <!-- Main Card Body (Premium Ceramic Off-White) -->
      <rect width="270" height="334" rx="14" fill="#fcfcf9" stroke="#87997a" stroke-width="1.2"/>

      <!-- Card Top Header -->
      <g transform="translate(18, 20)">
        <!-- Badge -->
        <rect width="130" height="24" rx="6" fill="#e8eee3" stroke="#b2c2ab" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="3" fill="#385423"/>
        <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" font-weight="700" fill="#2b401b">DECISION REFLEX</text>

        <!-- Speed indicator -->
        <text x="178" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="700" fill="#2b401b">⚡ 54ms</text>
      </g>

      <!-- Card Title -->
      <g transform="translate(18, 76)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="800" fill="#1b2419">Next Step Selection</text>
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" fill="#586b52">执行链路即时反射判定</text>
      </g>

      <!-- Active Selected Action (High-contrast Neon Green Pill) -->
      <g transform="translate(18, 116)">
        <rect width="234" height="42" rx="8" fill="#d7fa91" stroke="#9bc947" stroke-width="1"/>
        <path d="M14 21 L18 25 L28 14" stroke="#223315" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="800" fill="#18260f">Fast-path Execution</text>
        <text x="180" y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" font-weight="700" fill="#354e23">0.984</text>
      </g>

      <!-- Alternative Action 2 -->
      <g transform="translate(18, 168)">
        <rect width="234" height="36" rx="8" fill="#f0f2eb" stroke="#d2dacb" stroke-width="0.8"/>
        <circle cx="20" cy="18" r="4" fill="none" stroke="#75886d" stroke-width="1.5"/>
        <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#4d5f47">Fallback to LLM</text>
        <text x="188" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#75886d">0.016</text>
      </g>

      <!-- Confidence & Metrics Meter -->
      <g transform="translate(18, 226)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#586b52">Reflex Determinism</text>
        <text x="175" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" font-weight="700" fill="#2b401b">99.8%</text>

        <!-- Progress bar background -->
        <rect x="0" y="8" width="234" height="6" rx="3" fill="#e3e8de"/>
        <!-- Progress bar fill -->
        <rect x="0" y="8" width="210" height="6" rx="3" fill="#44632c"/>
      </g>

      <!-- Card Bottom Barcode & Machine Seal -->
      <g transform="translate(18, 290)">
        <line x1="0" y1="0" x2="234" y2="0" stroke="#d8dfd2" stroke-width="1"/>
        <!-- Fake Barcode -->
        <g transform="translate(0, 10)">
          <line x1="0" y1="0" x2="0" y2="12" stroke="#485c41" stroke-width="2"/>
          <line x1="4" y1="0" x2="4" y2="12" stroke="#485c41" stroke-width="1"/>
          <line x1="8" y1="0" x2="8" y2="12" stroke="#485c41" stroke-width="3"/>
          <line x1="14" y1="0" x2="14" y2="12" stroke="#485c41" stroke-width="1"/>
          <line x1="18" y1="0" x2="18" y2="12" stroke="#485c41" stroke-width="2"/>
          <line x1="24" y1="0" x2="24" y2="12" stroke="#485c41" stroke-width="4"/>
          <line x1="32" y1="0" x2="32" y2="12" stroke="#485c41" stroke-width="1"/>
          <line x1="36" y1="0" x2="36" y2="12" stroke="#485c41" stroke-width="2"/>
        </g>
        <text x="50" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="9" font-weight="600" fill="#6d8265">JEV-SYS1-CORE · #662</text>
        <text x="186" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="9" font-weight="700" fill="#2b401b">CERTIFIED</text>
      </g>
    </g>
  </g>
</svg>
